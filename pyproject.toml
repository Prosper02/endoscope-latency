[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endolatency"
version = "0.1.0"
description = "Desktop tool to measure glass-to-glass latency of an endoscope video chain and a telementoring link with an ATmega328 microcontroller and two light sensors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.6",
  "pyserial>=3.5",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pillow>=10",
  "mss>=9",
]

[project.scripts]
endolatency = "endolatency.app:main"

[tool.setuptools.packages.find]
include = ["endolatency*"]

[tool.setuptools.package-data]
endolatency = ["assets/*"]
